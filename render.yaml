services:
  - type: web
    name: croptrail-server
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: ./croptrail.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: USE_CACHED_DATA
        value: false
      - key: ALLOW_SAMPLE_FIXTURES
        value: false
      - key: DISABLE_SCHEDULER
        value: true
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: croptrail-client
          property: url
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: MANDI_RESOURCE_ID
        sync: false

  - type: web
    name: croptrail-client
    runtime: node
    plan: free
    buildCommand: cd client && npm ci && npm run build
    startCommand: cd client && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SERVER_URL
        fromService:
          type: web
          name: croptrail-server
          property: url
